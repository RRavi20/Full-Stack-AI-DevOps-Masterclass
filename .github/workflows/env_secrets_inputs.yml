name: Demo CI Env Secrets

on:
  push:
  #workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     
      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Install
        env:
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using $DB_PASSWORD"

      - name: Create demo file
        run: |
          echo "Hello from CI Pipeline" > demo.txt
          echo "File creted successfully"
      - name: Upload Demo
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-demo
          path: .
